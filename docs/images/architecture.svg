<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" role="img" aria-label="ServiceWire architecture: a client process calls a runtime-generated proxy that travels over named pipes or TCP to a host process which invokes your singleton service.">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arwl" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M10,0 L0,4 L10,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="40" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#0f172a">ServiceWire: one interface, two processes</text>
  <text x="40" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">A client calls a plain C# interface. ServiceWire generates the proxy and invokes your singleton inside the host process.</text>

  <!-- client panel -->
  <rect x="40" y="100" width="270" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="123" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#64748b">CLIENT PROCESS</text>

  <rect x="58" y="134" width="234" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="175" y="160" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Your application code</text>
  <line x1="175" y1="176" x2="175" y2="192" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="58" y="196" width="234" height="58" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="175" y="219" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">TcpClient&lt;IMath&gt;.Proxy</text>
  <text x="175" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1d4ed8">proxy type emitted at runtime</text>
  <line x1="175" y1="254" x2="175" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="58" y="274" width="234" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="175" y="297" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a">Channel</text>
  <text x="175" y="316" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">serialize, compress, frame</text>

  <!-- wire zone -->
  <text x="490" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#64748b">CHOOSE A TRANSPORT</text>

  <rect x="345" y="170" width="290" height="52" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text x="490" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#155e75">Named pipes &#183; same machine</text>
  <text x="490" y="210" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0e7490">NpHost &#8596; NpClient&lt;T&gt;</text>
  <line x1="310" y1="196" x2="343" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="637" y1="196" x2="670" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="345" y="250" width="290" height="52" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="490" y="272" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#92400e">TCP/IP &#183; across the network</text>
  <text x="490" y="290" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#b45309">TcpHost &#8596; TcpClient&lt;T&gt;</text>
  <line x1="310" y1="276" x2="343" y2="276" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="637" y1="276" x2="670" y2="276" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <text x="490" y="326" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">return value and out/ref parameters travel back</text>
  <line x1="637" y1="336" x2="345" y2="336" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arwl)"/>

  <!-- host panel -->
  <rect x="670" y="100" width="270" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="688" y="123" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#64748b">HOST PROCESS</text>

  <rect x="688" y="134" width="234" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="805" y="160" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">TcpHost / NpHost listener</text>
  <line x1="805" y1="176" x2="805" y2="192" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="688" y="196" width="234" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="805" y="219" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a">Dispatch</text>
  <text x="805" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">compiled delegate, not reflection</text>

  <line x1="805" y1="254" x2="805" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <rect x="688" y="274" width="234" height="58" rx="6" fill="#d1fae5" stroke="#0d9488"/>
  <text x="805" y="297" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#115e59">MathService : IMath</text>
  <text x="805" y="316" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0f766e">your singleton implementation</text>

  <!-- steps -->
  <line x1="40" y1="366" x2="940" y2="366" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="56" cy="398" r="11" fill="#2563eb"/>
  <text x="56" y="402" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="76" y="403" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Define the interface</text>

  <circle cx="281" cy="398" r="11" fill="#2563eb"/>
  <text x="281" y="402" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="301" y="403" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Implement it</text>

  <circle cx="506" cy="398" r="11" fill="#2563eb"/>
  <text x="506" y="402" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="526" y="403" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Open a host</text>

  <circle cx="731" cy="398" r="11" fill="#2563eb"/>
  <text x="731" y="402" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="751" y="403" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Call the generated proxy</text>
</svg>
