<svg xmlns="http://www.w3.org/2000/svg" width="980" height="458" viewBox="0 0 980 458" role="img" aria-label="Bar chart comparing mean microseconds per call in ServiceWire 6.0.1 and 7.0.0 on .NET 10 across six steady-state benchmarks; 7.0.0 is faster in every one.">
  <rect x="0" y="0" width="980" height="458" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="40" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#0f172a">Steady-state call cost: 6.0.1 vs 7.0.0</text>
  <text x="40" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">Mean microseconds per call on .NET 10, same machine, same benchmark suite. Lower is better.</text>

  <rect x="620" y="80" width="14" height="14" rx="3" fill="#94a3b8"/>
  <text x="640" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">6.0.1</text>
  <rect x="700" y="80" width="14" height="14" rx="3" fill="#2563eb"/>
  <text x="720" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">7.0.0</text>

  <text x="30" y="240" transform="rotate(-90 30 240)" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#64748b">microseconds per call</text>

  <line x1="90" y1="110" x2="900" y2="110" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="114" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#94a3b8">100</text>
  <line x1="90" y1="172.5" x2="900" y2="172.5" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="176.5" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#94a3b8">75</text>
  <line x1="90" y1="235" x2="900" y2="235" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="239" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#94a3b8">50</text>
  <line x1="90" y1="297.5" x2="900" y2="297.5" stroke="#e2e8f0" stroke-width="1"/>
  <text x="80" y="301.5" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#94a3b8">25</text>
  <line x1="90" y1="360" x2="900" y2="360" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="364" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#94a3b8">0</text>

  <rect x="113.5" y="290.25" width="40" height="69.75" rx="2" fill="#94a3b8"/>
  <text x="133.5" y="284" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">27.9</text>
  <rect x="161.5" y="322.75" width="40" height="37.25" rx="2" fill="#2563eb"/>
  <text x="181.5" y="316.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#1e40af">14.9</text>
  <text x="157.5" y="380" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">NpSim</text>
  <text x="157.5" y="398" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0d9488">47% faster</text>

  <rect x="248.5" y="193.75" width="40" height="166.25" rx="2" fill="#94a3b8"/>
  <text x="268.5" y="187.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">66.5</text>
  <rect x="296.5" y="310.75" width="40" height="49.25" rx="2" fill="#2563eb"/>
  <text x="316.5" y="304.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#1e40af">19.7</text>
  <text x="292.5" y="380" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">NpRg</text>
  <text x="292.5" y="398" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0d9488">70% faster</text>

  <rect x="383.5" y="197.25" width="40" height="162.75" rx="2" fill="#94a3b8"/>
  <text x="403.5" y="191" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">65.1</text>
  <rect x="431.5" y="308.75" width="40" height="51.25" rx="2" fill="#2563eb"/>
  <text x="451.5" y="302.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#1e40af">20.5</text>
  <text x="427.5" y="380" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">NpCxOut</text>
  <text x="427.5" y="398" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0d9488">69% faster</text>

  <rect x="518.5" y="240.25" width="40" height="119.75" rx="2" fill="#94a3b8"/>
  <text x="538.5" y="234" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">47.9</text>
  <rect x="566.5" y="257.75" width="40" height="102.25" rx="2" fill="#2563eb"/>
  <text x="586.5" y="251.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#1e40af">40.9</text>
  <text x="562.5" y="380" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">TcpSim</text>
  <text x="562.5" y="398" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0d9488">14% faster</text>

  <rect x="653.5" y="130.25" width="40" height="229.75" rx="2" fill="#94a3b8"/>
  <text x="673.5" y="124" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">91.9</text>
  <rect x="701.5" y="230.75" width="40" height="129.25" rx="2" fill="#2563eb"/>
  <text x="721.5" y="224.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#1e40af">51.7</text>
  <text x="697.5" y="380" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">TcpRg</text>
  <text x="697.5" y="398" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0d9488">44% faster</text>

  <rect x="788.5" y="140.75" width="40" height="219.25" rx="2" fill="#94a3b8"/>
  <text x="808.5" y="134.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">87.7</text>
  <rect x="836.5" y="230.75" width="40" height="129.25" rx="2" fill="#2563eb"/>
  <text x="856.5" y="224.5" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#1e40af">51.7</text>
  <text x="832.5" y="380" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">TcpCxOut</text>
  <text x="832.5" y="398" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0d9488">41% faster</text>

  <text x="40" y="426" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">Sim = one small call. Rg = a call returning a list. CxOut = a complex type with an out parameter. Np = named pipes, Tcp = loopback TCP.</text>
  <text x="40" y="444" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">BenchmarkDotNet 0.15.8, Windows 11, AMD Ryzen Threadripper PRO 5975WX, .NET SDK 10.0.204.</text>
</svg>
