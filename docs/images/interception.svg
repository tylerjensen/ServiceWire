<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-label="Interception wraps a target object: PreInvoke runs, then the method, then PostInvoke; a thrown exception goes to the ExceptionHandler which decides whether to rethrow.">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arwr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="420" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="40" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#0f172a">Cross-cutting concerns without touching the method</text>
  <text x="40" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#475569">Interceptor.Intercept&lt;T&gt; returns a proxy with the same interface. Your implementation is unchanged.</text>

  <rect x="40" y="144" width="120" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="100" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Caller</text>
  <text x="100" y="192" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#475569">t.Add(3, 4)</text>
  <line x1="164" y1="176" x2="196" y2="176" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="180" y="104" width="620" height="160" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="196" y="128" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="600" fill="#1e3a8a">Interceptor.Intercept&lt;ISimpleMath&gt;(new SimpleMath(), cut)</text>

  <rect x="200" y="144" width="170" height="64" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="285" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">PreInvoke</text>
  <text x="285" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#475569">id, method name, args</text>
  <line x1="372" y1="176" x2="386" y2="176" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="390" y="144" width="200" height="64" rx="8" fill="#d1fae5" stroke="#0d9488"/>
  <text x="490" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#115e59">Your method runs</text>
  <text x="490" y="190" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#0f766e">SimpleMath.Add</text>
  <line x1="592" y1="176" x2="606" y2="176" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="610" y="144" width="170" height="64" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="695" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">PostInvoke</text>
  <text x="695" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#475569">return value + byref values</text>

  <line x1="784" y1="176" x2="816" y2="176" stroke="#64748b" stroke-width="1.5" marker-end="url(#arw)"/>
  <rect x="820" y="144" width="120" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="880" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Result</text>
  <text x="880" y="192" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#475569">7</text>

  <line x1="490" y1="210" x2="490" y2="296" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arwr)"/>
  <text x="502" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#991b1b">if it throws</text>

  <rect x="380" y="300" width="220" height="60" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="490" y="325" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#991b1b">ExceptionHandler</text>
  <text x="490" y="345" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#b91c1c">returns bool: rethrow?</text>

  <text x="366" y="324" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">false</text>
  <text x="366" y="342" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">swallowed &#183; caller gets the default</text>
  <text x="614" y="324" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">true</text>
  <text x="614" y="342" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">the original exception is rethrown</text>

  <text x="40" y="394" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#475569">Interception is local: it wraps any object inside your own process. Use it on the host side, the client side, or on code that never goes near a wire.</text>
</svg>
